name: Build Java Plugin

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Java (JDK 21) einrichten
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Suche pom.xml und baue Plugin
      run: |
        POM_PATH=$(find . -name "pom.xml" -not -path "*/target/*" | head -n 1)
        if [ -z "$POM_PATH" ]; then
          echo "FEHLER: Keine pom.xml im Repository gefunden! Bitte lade deinen Quellcode hoch."
          exit 1
        fi
        echo "pom.xml gefunden unter: $POM_PATH"
        mvn clean package --file "$POM_PATH"

    - name: JAR-Datei als Artifact hochladen
      uses: actions/upload-artifact@v4
      with:
        name: ClanSystem-Plugin
        path: "**/target/*.jar"
